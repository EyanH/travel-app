<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Travel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />

<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --bg:#0b0e14; --bg2:#070a0f; --elev:#11151d;
    --card:#141924; --card2:#1b212d; --card3:#232a37;
    --border:#242c3a; --border2:#1a212c;
    --text:#eef2f7; --text2:#c7cfda; --muted:#8b95a6; --muted2:#5c6577;
    --accent:#78bbff; --accent2:#5aa2ff; --gold:#e6b566; --good:#54c98a; --bad:#f4776a;
    --travel:#5aa2ff; --explore:#55c98a; --trek:#ef9350; --flex:#b18cf0;
    --shadow:0 10px 40px -12px rgba(0,0,0,.7); --shadow-lg:0 24px 70px -20px rgba(0,0,0,.8);
    --radius:18px; --radius-sm:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html,body,#root{min-height:100vh;min-height:100dvh;background:var(--bg)}
  body{color:var(--text);font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;
    background-image:radial-gradient(900px 500px at 78% -8%, rgba(120,187,255,.08), transparent 60%),
                     radial-gradient(700px 500px at 5% 3%, rgba(177,140,240,.06), transparent 55%);
    background-attachment:fixed;}
  h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:700;margin:0;line-height:1.12}
  a{color:var(--accent);text-decoration:none}
  button{font-family:inherit}
  input,textarea{font-family:inherit;color:inherit}
  ::selection{background:rgba(120,187,255,.28)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--card3);border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px}
  @media(max-width:560px){.wrap{padding:0 15px}}

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{opacity:.4}}
  .rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}

  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);
    background:rgba(27,33,45,.72);color:var(--text);border-radius:11px;padding:9px 15px;
    font-size:14px;font-weight:600;cursor:pointer;transition:.16s;backdrop-filter:blur(8px)}
  .btn:hover{border-color:var(--muted2);background:var(--card2);transform:translateY(-1px)}
  .btn.primary{background:linear-gradient(180deg,#8cc4ff,#5aa2ff);border-color:transparent;color:#08111e;box-shadow:0 6px 20px -6px rgba(90,162,255,.6)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
  .btn.danger:hover{border-color:var(--bad);color:var(--bad)}
  .icon-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:5px;border-radius:8px;font-size:14px;line-height:1;transition:.14s}
  .icon-btn:hover{color:var(--text);background:var(--card2)}

  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
    padding:4px 11px;border-radius:999px;background:rgba(27,33,45,.7);border:1px solid var(--border);color:var(--text2);letter-spacing:.2px}
  .chip.soon{background:rgba(120,187,255,.14);border-color:rgba(120,187,255,.35);color:#a9d1ff}
  .chip.now{background:rgba(84,201,138,.15);border-color:rgba(84,201,138,.4);color:#7ee0ac}
  .chip.past{background:rgba(139,149,166,.12);color:var(--muted)}
  .flagimg{width:auto;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.6);vertical-align:middle;display:inline-block}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:24px 0 6px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:19px;
    background:linear-gradient(145deg,#1c2434,#11151d);border:1px solid var(--border);box-shadow:var(--shadow)}
  .brand .name{font-weight:700;font-size:16px;letter-spacing:.2px}
  .brand .name small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:.3px}

  .syncbadge{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--text2);
    background:rgba(27,33,45,.7);border:1px solid var(--border);border-radius:999px;padding:6px 13px;backdrop-filter:blur(8px)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted2)}
  .dot.live{background:var(--good);box-shadow:0 0 0 4px rgba(84,201,138,.14)}
  .dot.local{background:var(--gold)}
  .dot.saving{background:var(--accent);animation:pulse 1s infinite}
  .dot.error{background:var(--bad)}

  .home-hero{padding:30px 0 8px}
  .home-hero h1{font-size:44px;letter-spacing:-.5px}
  .home-hero p{color:var(--muted);margin-top:8px;font-size:15px;max-width:520px}
  @media(max-width:560px){.home-hero h1{font-size:32px}}
  .group-label{display:flex;align-items:center;gap:12px;margin:34px 0 4px;color:var(--muted);
    font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}
  .group-label:after{content:"";flex:1;height:1px;background:var(--border2)}

  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:14px 0 8px}
  @media(max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){.tiles{grid-template-columns:1fr}}
  .tile{position:relative;border-radius:var(--radius);overflow:hidden;cursor:pointer;aspect-ratio:3/3.5;
    border:1px solid var(--border);background:var(--card);transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s;box-shadow:var(--shadow)}
  .tile:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
  .tile .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .tile:hover .bg{transform:scale(1.07)}
  .tile .grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(7,10,15,.95) 4%,rgba(7,10,15,.5) 40%,rgba(7,10,15,.08) 78%,rgba(7,10,15,.25) 100%)}
  .tile .ring{position:absolute;inset:0;border-radius:var(--radius);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);pointer-events:none}
  .tile .top{position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:flex-start;justify-content:space-between}
  .tile .content{position:absolute;left:18px;right:18px;bottom:16px}
  .tile .content h2{font-size:29px;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.7);letter-spacing:-.3px}
  .tile .content .sub{color:#dfe5ec;font-size:13px;margin-top:4px;text-shadow:0 1px 8px rgba(0,0,0,.7);font-weight:500}
  .tile .stats{display:flex;gap:16px;margin-top:13px}
  .tile .stats .s b{font-size:17px;font-family:'Playfair Display',serif;color:#fff}
  .tile .stats .s span{font-size:10.5px;color:#c3ccd6;margin-left:4px;text-transform:uppercase;letter-spacing:.6px}
  .tile.new{display:flex;align-items:center;justify-content:center;border-style:dashed;background:rgba(20,25,36,.4);box-shadow:none}
  .tile.new:hover{border-color:var(--accent);background:rgba(120,187,255,.05);transform:translateY(-4px)}
  .tile.new .np{text-align:center;color:var(--muted)}
  .tile.new .np .plus{font-size:34px;font-weight:200;line-height:1;margin-bottom:8px}
  .tile.new:hover .np{color:var(--accent)}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 0}

  .hero{position:relative;height:300px;overflow:hidden;background:var(--card)}
  @media(max-width:560px){.hero{height:230px}}
  .hero .bg{position:absolute;inset:0;background-size:cover;background-position:center}
  .hero .grad{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 1%,rgba(11,14,20,.35) 52%,rgba(11,14,20,.5) 100%)}
  .hero .top{position:absolute;top:16px;left:0;right:0}
  .hero .top .wrap{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .hero .htext{position:absolute;left:0;right:0;bottom:20px}
  .hero .htext .inner{display:flex;flex-direction:column;gap:7px}
  .hero .htext .line1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .hero .htext h1{font-size:46px;color:#fff;text-shadow:0 3px 22px rgba(0,0,0,.65);letter-spacing:-.5px}
  @media(max-width:560px){.hero .htext h1{font-size:31px}}
  .hero .htext .sub{color:#e6ebf1;font-size:14.5px;text-shadow:0 1px 10px rgba(0,0,0,.8);font-weight:500}

  .statrow{display:flex;gap:30px;flex-wrap:wrap;padding:20px 0 2px}
  .statrow .s b{font-family:'Playfair Display',serif;font-size:26px}
  .statrow .s span{color:var(--muted);font-size:11.5px;margin-left:7px;text-transform:uppercase;letter-spacing:.7px}

  .tabsbar{position:sticky;top:0;z-index:30;background:linear-gradient(var(--bg),var(--bg) 70%,rgba(11,14,20,.6));padding-top:8px}
  .tabs{display:flex;gap:7px;overflow-x:auto;padding:10px 0;scrollbar-width:none;border-bottom:1px solid var(--border2)}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;padding:9px 16px;border-radius:11px;border:1px solid transparent;color:var(--muted);
    font-weight:600;font-size:14px;cursor:pointer;background:transparent;transition:.15s;display:flex;align-items:center;gap:7px}
  .tab:hover{color:var(--text2);background:var(--card)}
  .tab.active{color:var(--text);background:var(--card2);border-color:var(--border);box-shadow:var(--shadow)}

  .card{background:linear-gradient(180deg,var(--card),var(--elev));border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin:18px 0;box-shadow:var(--shadow)}
  .card.tight{padding:15px}
  .section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 2px}
  .section-title h2{font-size:26px;letter-spacing:-.3px}
  .muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}

  .rail{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rpill{flex:0 0 auto;min-width:62px;text-align:center;padding:9px 8px;border-radius:13px;cursor:pointer;
    background:var(--card);border:1px solid var(--border);transition:.15s}
  .rpill:hover{border-color:var(--muted2);transform:translateY(-2px)}
  .rpill .rw{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .rpill .rn{font-size:19px;font-weight:700;font-family:'Playfair Display',serif;margin-top:1px}
  .rpill .re{font-size:15px;margin-top:2px}

  .day{position:relative;padding-left:22px}
  .day:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:4px;background:var(--muted2)}
  .day.travel:before{background:var(--travel)} .day.explore:before{background:var(--explore)}
  .day.trek:before{background:var(--trek)} .day.flex:before{background:var(--flex)}
  .day-head{display:flex;align-items:flex-start;gap:13px}
  .day-emoji{font-size:27px;line-height:1;cursor:pointer;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
  .day-meta{flex:1;min-width:0}
  .day-daylabel{font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
  .day-title{font-size:22px;margin-top:2px;letter-spacing:-.2px}
  .day-loc{color:var(--muted);font-size:13px;margin-top:3px}
  .type-pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:4px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .type-pill.travel{background:rgba(90,162,255,.16);color:#9dc6ff}
  .type-pill.explore{background:rgba(85,201,138,.16);color:#7fe0ac}
  .type-pill.trek{background:rgba(239,147,80,.17);color:#f6b07e}
  .type-pill.flex{background:rgba(177,140,240,.17);color:#cbb0f7}

  .detail-row{display:flex;gap:14px;padding:11px 0;position:relative}
  .detail-row+.detail-row{border-top:1px solid var(--border2)}
  .detail-time{flex:0 0 78px;color:var(--accent);font-weight:700;font-size:12.5px;padding-top:2px}
  .detail-body{flex:1;min-width:0}
  .detail-text{font-size:14.5px;font-weight:500}
  .detail-sub{color:var(--muted);font-size:13px;margin-top:3px;white-space:pre-wrap}
  .tips{margin-top:14px;padding:12px 14px;background:linear-gradient(180deg,rgba(230,181,102,.09),rgba(230,181,102,.05));
    border:1px solid rgba(230,181,102,.24);border-radius:12px;font-size:13.5px;color:#eccf98;line-height:1.55}
  .tips b{color:var(--gold)}
  .accom{margin-top:12px;display:flex;align-items:center;gap:9px;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:11px 14px}
  .accom .al{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:600}
  .suggs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

  .ed{border-radius:6px;padding:1px 5px;margin:-1px -5px;cursor:text;transition:background .12s,box-shadow .12s;outline:none;white-space:pre-wrap;word-break:break-word}
  .ed:hover{background:rgba(139,149,166,.1)}
  .ed:focus{background:rgba(120,187,255,.12);box-shadow:inset 0 0 0 1px rgba(120,187,255,.4)}
  .ed.empty:before{content:attr(data-ph);color:var(--muted2);font-style:italic}

  .wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:11px}
  .wcard{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center}
  .wcard .wc{font-size:28px} .wcard .wt{font-size:22px;font-weight:700;font-family:'Playfair Display',serif;margin-top:2px}
  .wcard .wl{font-size:12.5px;color:var(--text2);text-transform:capitalize;margin-top:4px;font-weight:600}
  .wcard .wr{font-size:11px;color:var(--muted);margin-top:2px}

  .checkline{display:flex;align-items:center;gap:12px;padding:9px 0}
  .checkline+.checkline{border-top:1px solid var(--border2)}
  .checkbox{flex:0 0 21px;height:21px;border-radius:7px;border:1.5px solid var(--muted2);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.14s;font-size:13px}
  .checkbox:hover{border-color:var(--accent)}
  .checkbox.on{background:var(--good);border-color:var(--good);color:#062;box-shadow:0 0 0 4px rgba(84,201,138,.12)}
  .checkline.done .ct{color:var(--muted2);text-decoration:line-through}
  .ct{flex:1;min-width:0}
  .addline{display:flex;gap:9px;margin-top:12px}
  .addline input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:14px}
  .addline input:focus{outline:none;border-color:var(--accent)}
  .prog{height:9px;border-radius:999px;background:var(--card2);overflow:hidden;margin:8px 0 2px;border:1px solid var(--border2)}
  .prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--good),#7ee0ac);border-radius:999px;transition:width .4s}

  .quest{display:flex;align-items:flex-start;gap:12px;padding:12px 0}
  .quest+.quest{border-top:1px solid var(--border2)}
  .quest .checkbox{margin-top:1px}
  .quest.done .qt{color:var(--muted2);text-decoration:line-through}
  .qt{font-weight:500}
  .qsub{color:var(--muted);font-size:12.5px;margin-top:3px;white-space:pre-wrap}
  .qbadge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:999px;color:#08111e;white-space:nowrap}

  .flight .route{font-family:'Playfair Display',serif;font-size:24px;letter-spacing:-.3px}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin-top:12px}
  .fgrid .fl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .fgrid .fv{font-size:14px;font-weight:600;margin-top:2px}

  .info-block h3{font-size:19px;margin-bottom:10px}
  .info-list{margin:0;padding-left:2px;list-style:none}
  .info-list li{margin:6px 0;font-size:14px;padding-left:16px;position:relative}
  .info-list li:before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent2)}
  .info-content{font-size:14px;color:var(--text2);white-space:pre-wrap;line-height:1.65}
  .price-tag{color:var(--good);font-weight:700}

  .overlay{position:fixed;inset:0;background:rgba(5,8,12,.7);backdrop-filter:blur(6px);z-index:100;
    display:flex;align-items:flex-start;justify-content:center;padding:44px 16px;overflow:auto;animation:fade .2s}
  .modal{background:linear-gradient(180deg,var(--card),var(--elev));border:1px solid var(--border);border-radius:var(--radius);
    width:100%;max-width:530px;box-shadow:var(--shadow-lg);animation:pop .28s cubic-bezier(.2,.7,.2,1)}
  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--border2)}
  .modal-b{padding:22px} .modal-f{display:flex;gap:11px;justify-content:flex-end;padding:0 22px 22px}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px}
  .field .hint{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted2)}
  .field input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:11px 13px;font-size:14.5px}
  .field input:focus{outline:none;border-color:var(--accent)}
  .field .row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .err{color:var(--bad);font-size:13px;margin-top:6px}
  .pop{position:absolute;right:0;top:42px;width:270px;z-index:50;padding:14px;background:linear-gradient(180deg,var(--card),var(--elev));
    border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);animation:pop .2s}

  .loading{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:14px}
  .spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
</style>
</head>
<body>
<div id="root"></div>

<script id="seed-morocco" type="application/json">
{

  "country": "Morocco",
  "archived": false,
  "heroImage": "https://images.unsplash.com/photo-1597212618440-806262de4f6b?w=1600&q=80",
  "meta": {

  "days": [

      "day": "Day 1",
      "title": "Toronto → Casablanca",

      "type": "travel",
      "emoji": "✈️",

function detectCountry(trip){
  if(trip.country) return trip.country;
  const hay=(((trip.meta&&(trip.meta.tripName+" "+trip.meta.subtitle))||"")+" "+(trip.slug||"")).toLowerCase();
  for(const k in CITY_TO_COUNTRY){ if(hay.includes(k)) return CITY_TO_COUNTRY[k]; }
  for(const k in CODES){ if(hay.includes(k)) return k.charAt(0).toUpperCase()+k.slice(1); }
  return "";
}
function flagFor(c){ if(!c) return "🌍"; return FLAGS[c.trim().toLowerCase()]||"🌍"; }
function heroFor(trip,country){
  if(trip.heroImage) return trip.heroImage;
  const c=(country||"").trim().toLowerCase();
  return DEFAULT_HERO[c]||"";
}

/* ============ STORAGE ============ */
const LS_INDEX="travelapp:slugs", LS_TRIP=(s)=>`travelapp:trip:${s}`;
function normalize(id,data){
  const d=Object.assign({},data);
  d.slug=d.slug||id;
  if(!d.meta) d.meta={tripName:id,subtitle:"",startDate:"",endDate:"",stats:[]};
  d.country=d.country||detectCountry(d);
  return d;
}
const store={
  listSlugs(){ try{return JSON.parse(localStorage.getItem(LS_INDEX))||[];}catch{return[];} },
  _saveIndex(s){ localStorage.setItem(LS_INDEX,JSON.stringify([...new Set(s)])); },
  loadTrip(s){ try{return JSON.parse(localStorage.getItem(LS_TRIP(s)));}catch{return null;} },
  putLocal(s,data){ localStorage.setItem(LS_TRIP(s),JSON.stringify(data)); const i=store.listSlugs(); if(!i.includes(s)){i.push(s);store._saveIndex(i);} },
  saveTrip(s,data){
    store.putLocal(s,data);
    if(FIREBASE_ON&&fb) fb.db.collection("trips").doc(s).set(data,{merge:true}).catch(e=>console.warn("cloud save failed",e));
  },
  deleteTrip(s){
    localStorage.removeItem(LS_TRIP(s)); store._saveIndex(store.listSlugs().filter(x=>x!==s));
    if(FIREBASE_ON&&fb) fb.db.collection("trips").doc(s).delete().catch(()=>{});
  }
};
function ensureSeed(){
  try{
    const seed=JSON.parse(document.getElementById("seed-morocco").textContent);
    if(!store.loadTrip(seed.slug)){ seed.createdAt=seed.createdAt||Date.now(); store.saveTrip(seed.slug,seed); }
  }catch(e){ console.warn("seed failed",e); }
}

function useRoute(){

  useEffect(()=>{ const on=()=>setSlug(new URLSearchParams(location.search).get("trip")||null);
    window.addEventListener("popstate",on); return()=>window.removeEventListener("popstate",on); },[]);
  const go=useCallback((s)=>{ history.pushState({},"",s?`${location.pathname}?trip=${encodeURIComponent(s)}`:location.pathname); setSlug(s); window.scrollTo(0,0); },[]);
  return [slug,go];
}
const uid=(p="id")=>p+Math.random().toString(36).slice(2,9);
function slugify(name,end){ const y=(end||"").slice(0,4)||(name.match(/\b(20\d{2})\b/)||[])[1]||""; const b=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); return y?`${b}-${y}`:b; }
const ML=["January","February","March","April","May","June","July","August","September","October","November","December"];
function fmtRange(a,b){ if(!a) return ""; const s=new Date(a+"T00:00:00"); if(isNaN(s)) return `${a}${b?" - "+b:""}`;
  const e=b?new Date(b+"T00:00:00"):null; const f=(d)=>ML[d.getMonth()].slice(0,3)+" "+d.getDate();
  if(!e) return f(s)+", "+s.getFullYear(); return `${f(s)} - ${f(e)}, ${e.getFullYear()}`; }
function countdown(a,b){ if(!a) return null; const t=new Date(); t.setHours(0,0,0,0);
  const s=new Date(a+"T00:00:00"), e=new Date((b||a)+"T00:00:00"); if(isNaN(s)) return null; const D=86400000;
  if(t<s){ const n=Math.round((s-t)/D); return {label:n===0?"Starts tomorrow":`In ${n} day${n>1?"s":""}`,tone:"soon",upcoming:true}; }
  if(t<=e){ const d=Math.round((t-s)/D)+1, tot=Math.round((e-s)/D)+1; return {label:`Day ${d} of ${tot}`,tone:"now",upcoming:true}; }
  return {label:"Completed",tone:"past",upcoming:false}; }
function haversine(a,b){ if(!a||!b) return null; const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lon-a.lon)*Math.PI/180,la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2; return Math.round(R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))); }
const WMO={0:["☀️","clear"],1:["🌤️","mainly clear"],2:["⛅","partly cloudy"],3:["☁️","overcast"],45:["🌫️","fog"],48:["🌫️","fog"],51:["🌦️","drizzle"],53:["🌦️","drizzle"],55:["🌦️","drizzle"],61:["🌧️","rain"],63:["🌧️","rain"],65:["🌧️","heavy rain"],71:["🌨️","snow"],73:["🌨️","snow"],75:["❄️","snow"],80:["🌦️","showers"],81:["🌦️","showers"],82:["⛈️","heavy showers"],95:["⛈️","storm"],96:["⛈️","storm"],99:["⛈️","storm"]};
const wmo=(c)=>WMO[c]||["🌡️","-"];
function weekdayShort(dateStr){ const m={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  const c=(dateStr||"").replace(/^[A-Za-z]+,\s*/,"").trim().split(" "); if(c.length<2) return {w:"",n:dateStr||""};
  const mo=m[(c[0]||"").slice(0,3).toLowerCase()], day=parseInt(c[1]); if(mo==null||isNaN(day)) return {w:"",n:dateStr};
  const d=new Date(2026,mo,day); return {w:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()], n:String(day)}; }

/* ============ EDITABLE ============ */
function Editable({value,onChange,placeholder="",className="",multiline=false,tag="span"}){
  const ref=useRef(null); const Tag=tag;
  const commit=()=>{ const t=ref.current.innerText.replace(/\n+$/,""); if(t!==(value||"")) onChange(t); };
  useEffect(()=>{ if(ref.current&&ref.current.innerText!==(value||"")) ref.current.innerText=value||""; },[value]);
  return <Tag ref={ref} className={`ed ${!value?"empty":""} ${className}`} data-ph={placeholder} contentEditable suppressContentEditableWarning
    onBlur={commit} onKeyDown={(e)=>{ if(!multiline&&e.key==="Enter"){e.preventDefault();e.target.blur();} }}>{value||""}</Tag>;
}

        <input defaultValue={trip.country||country||""} placeholder="Country" onBlur={e=>update(t=>{t.country=e.target.value.trim();return t;})}/></div>
      <button className="btn ghost sm" style={{width:"100%",marginBottom:8}} onClick={()=>update(t=>{t.archived=!t.archived;return t;})}>{trip.archived?"Unarchive trip":"Archive trip"}</button>
      <button className="btn ghost danger sm" style={{width:"100%"}} onClick={()=>{ if(confirm(`Delete "${trip.meta?.tripName||trip.slug}"? This cannot be undone.`)) onDelete(); }}>Delete trip</button>
    </div>
  );
}
function StatRow({trip,update}){
  const stats=trip.meta?.stats||[]; if(stats.length===0) return null;
  return <div className="statrow">{stats.map((s,i)=><div className="s" key={i}>
    <b><Editable value={s.n} onChange={v=>update(t=>{t.meta.stats[i].n=v;return t;})}/></b>
    <span><Editable value={s.l} onChange={v=>update(t=>{t.meta.stats[i].l=v;return t;})}/></span></div>)}</div>;
}

/* ============ ITINERARY ============ */
function Itinerary({trip,update}){
  const days=trip.days||[];
  const addDay=()=>update(t=>{ (t.days=t.days||[]).push({id:uid("d"),date:"",day:`Day ${t.days.length+1}`,title:"New day",location:"",type:"explore",emoji:"📍",details:[],tips:"",accommodation:null,suggestions:[]}); return t; });
  return (
    <div>
      <Weather trip={trip}/>
      {days.length>1 && <div className="rail">{days.map((d,i)=>{ const wd=weekdayShort(d.date);
        return <div className="rpill" key={d.id||i} onClick={()=>{const el=document.getElementById("day-"+(d.id||i)); if(el) el.scrollIntoView({behavior:"smooth",block:"start"});}}>
          <div className="rw">{wd.w||("D"+(i+1))}</div><div className="rn">{wd.n||(i+1)}</div><div className="re">{d.emoji||"📍"}</div></div>; })}</div>}
      <div className="section-title"><h2>Itinerary</h2><button className="btn sm" onClick={addDay}>+ Add day</button></div>
      {days.length===0 && <div className="card muted center">No days yet. Add your first day.</div>}
      {days.map((d,i)=><DayCard key={d.id||i} day={d} idx={i} update={update}/>)}
    </div>
  );
}
function DayCard({day,idx,update}){
  const [open,setOpen]=useState(true);
  const patch=(fn)=>update(t=>{ fn(t.days[idx]); return t; });
  const cycleType=()=>patch(d=>{ d.type=TYPE_ORDER[(TYPE_ORDER.indexOf(d.type)+1)%TYPE_ORDER.length]; });
  const del=()=>{ if(confirm("Delete this day?")) update(t=>{t.days.splice(idx,1);return t;}); };
  const type=TC[day.type]?day.type:"explore";
  return (
    <div className={"card day "+type} id={"day-"+(day.id||idx)}>
      <div className="day-head">
        <div className="day-emoji" title="Change emoji" onClick={()=>{const e=prompt("Emoji:",day.emoji||"📍");if(e!==null)patch(d=>d.emoji=e);}}>{day.emoji||"📍"}</div>
        <div className="day-meta">
          <div className="day-daylabel"><Editable value={day.day} onChange={v=>patch(d=>d.day=v)} placeholder="Day 1"/>{" · "}<Editable value={day.date} onChange={v=>patch(d=>d.date=v)} placeholder="Mon, Jan 1"/></div>
          <div className="day-title"><Editable value={day.title} onChange={v=>patch(d=>d.title=v)} placeholder="Title"/></div>
          <div className="day-loc">📍 <Editable value={day.location} onChange={v=>patch(d=>d.location=v)} placeholder="Location"/></div>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:8}}>
          <span className={"type-pill "+type} onClick={cycleType} title="Change type">{TC[type].label}</span>
          <div style={{display:"flex",gap:2}}><button className="icon-btn" onClick={()=>setOpen(o=>!o)}>{open?"▾":"▸"}</button><button className="icon-btn" onClick={del}>🗑</button></div>
        </div>
      </div>
      {open && <div style={{marginTop:14}}>
        {(day.details||[]).map((dt,j)=>(
          <div className="detail-row" key={j}>
            <div className="detail-time"><Editable value={dt.time} onChange={v=>patch(d=>d.details[j].time=v)} placeholder="Time"/></div>
            <div className="detail-body">
              <div className="detail-text"><Editable value={dt.text} onChange={v=>patch(d=>d.details[j].text=v)} placeholder="What's happening"/></div>
              <div className="detail-sub"><Editable value={dt.sub} onChange={v=>patch(d=>d.details[j].sub=v)} placeholder="Notes" multiline/></div>
            </div>
            <button className="icon-btn" onClick={()=>patch(d=>d.details.splice(j,1))}>✕</button>
          </div>
        ))}
        <button className="btn ghost sm" style={{marginTop:10}} onClick={()=>patch(d=>(d.details=d.details||[]).push({time:"",text:"",sub:""}))}>+ Add item</button>
        {day.tips!==undefined && <div className="tips"><b>💡 Tip: </b><Editable value={day.tips} onChange={v=>patch(d=>d.tips=v)} placeholder="Add a tip" multiline/></div>}
        <div className="accom"><span style={{fontSize:18}}>🛏</span><div style={{flex:1}}><div className="al">Accommodation</div>
          <Editable value={day.accommodation||""} onChange={v=>patch(d=>d.accommodation=v||null)} placeholder="Hotel, riad, Airbnb…"/></div></div>
        {(day.suggestions&&day.suggestions.length>0) && <div className="suggs">{day.suggestions.map((s,k)=>(
          <span className="chip" key={k}><Editable value={s} onChange={v=>patch(d=>d.suggestions[k]=v)}/><span className="icon-btn" style={{padding:0,marginLeft:2}} onClick={()=>patch(d=>d.suggestions.splice(k,1))}>✕</span></span>))}</div>}
        <button className="btn ghost sm" style={{marginTop:10}} onClick={()=>patch(d=>(d.suggestions=d.suggestions||[]).push("New idea"))}>+ Add suggestion</button>
      </div>}
    </div>
  );
}

/* ============ WEATHER ============ */
function Weather({trip}){
  const [data,setData]=useState(null); const [err,setErr]=useState(false);
  const cities=useMemo(()=>Object.entries(trip.cityCoords||{}).slice(0,10),[trip.cityCoords]);
  useEffect(()=>{ if(cities.length===0){setData([]);return;} let alive=true;
    Promise.all(cities.map(([name,c])=>fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=auto`).then(r=>r.json()).then(j=>({name,d:j.daily})).catch(()=>({name,d:null}))))
      .then(res=>{ if(alive) setData(res); }).catch(()=>{ if(alive) setErr(true); });
    return()=>{alive=false;}; },[cities]);
  if(cities.length===0) return null;
  return (
    <div className="card">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><h3 style={{fontSize:19}}>Weather right now</h3><span className="chip">Open-Meteo · live</span></div>
      {!data ? <div className="muted small">Loading weather…</div> : err ? <div className="muted small">Weather unavailable.</div> :
        <div className="wgrid">{data.map(({name,d})=>{ if(!d) return <div className="wcard" key={name}><div className="wl">{name}</div><div className="wr">-</div></div>;
          const [ic,lab]=wmo(d.weather_code?.[0]); return <div className="wcard" key={name}><div className="wc">{ic}</div><div className="wt">{Math.round(d.temperature_2m_max?.[0])}°</div><div className="wl">{name}</div><div className="wr">{Math.round(d.temperature_2m_min?.[0])}° · {lab}</div></div>; })}</div>}
    </div>
  );
}

/* ============ FLIGHTS ============ */
const FL_LABELS={date:"Date",airline:"Airline",flights:"Flights",flight:"Flight",depart:"Depart",arrive:"Arrive",duration:"Duration",stop:"Stop",cost:"Cost",fare:"Fare",confirmation:"Confirmation"};
const FL_ORDER=["date","airline","flights","flight","depart","arrive","duration","stop","fare","cost","confirmation"];
function Flights({trip,update}){
  const flights=trip.flights||[];
  const patch=(i,fn)=>update(t=>{fn(t.flights[i]);return t;});
  const add=()=>update(t=>{(t.flights=t.flights||[]).push({id:uid("f"),route:"YYZ → ",date:"",airline:"",flight:"",depart:"",arrive:"",duration:"",stop:"",cost:"",confirmation:""});return t;});
  const flnotes=trip.flnotes;
  return (
    <div>
      <div className="section-title"><h2>Flights</h2><button className="btn sm" onClick={add}>+ Add flight</button></div>
      {flights.map((f,i)=>{ const keys=FL_ORDER.filter(k=>k in f); const extra=Object.keys(f).filter(k=>k!=="id"&&k!=="route"&&!FL_ORDER.includes(k));
        const shown=keys.concat(extra); return (
        <div className="card flight" key={f.id||i}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
            <div className="route"><Editable value={f.route} onChange={v=>patch(i,x=>x.route=v)} placeholder="YYZ → CMN → RAK"/></div>
            <button className="icon-btn" onClick={()=>update(t=>{t.flights.splice(i,1);return t;})}>🗑</button>
          </div>
          <div className="fgrid">{shown.map(k=><div key={k}><div className="fl">{FL_LABELS[k]||k}</div><div className="fv"><Editable value={String(f[k]??"")} onChange={v=>patch(i,x=>x[k]=v)} placeholder="-"/></div></div>)}</div>
        </div>); })}
      {flights.length===0 && <div className="card muted center">No flights yet.</div>}
      {(flnotes!==undefined&&flnotes!==null) && <div className="card tight">
        <div className="fl" style={{fontSize:11,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".6px",marginBottom:8,fontWeight:600}}>Notes</div>
        {typeof flnotes==="object" ? Object.entries(flnotes).map(([k,v])=>(
          <div key={k} style={{marginBottom:12}}><div style={{fontSize:10.5,textTransform:"uppercase",letterSpacing:".6px",color:"var(--muted)",fontWeight:600,marginBottom:3}}>{k}</div>
            <div className="info-content"><Editable value={String(v??"")} onChange={val=>update(t=>{t.flnotes[k]=val;return t;})} multiline/></div></div>))
          : <div className="info-content"><Editable value={flnotes} onChange={v=>update(t=>{t.flnotes=v;return t;})} placeholder="Baggage, booking refs, rules…" multiline/></div>}
      </div>}
    </div>
  );
}

/* ============ PACKING ============ */
function Packing({trip,update}){
  const packing=trip.packing||{}; const checked=trip.checked||{};
  const cats=Object.keys(packing);
  const all=Object.values(packing).flat(); const done=all.filter(x=>checked[x]).length;
  const toggle=(item)=>update(t=>{t.checked=t.checked||{};t.checked[item]=!t.checked[item];return t;});
  const addItem=(cat,val)=>update(t=>{t.packing=t.packing||{};(t.packing[cat]=t.packing[cat]||[]).push(val);return t;});
  const delItem=(cat,idx)=>update(t=>{const v=t.packing[cat][idx];t.packing[cat].splice(idx,1);if(t.checked)delete t.checked[v];return t;});
  const editItem=(cat,idx,val)=>update(t=>{const old=t.packing[cat][idx];t.packing[cat][idx]=val;if(t.checked&&t.checked[old]!==undefined){t.checked[val]=t.checked[old];delete t.checked[old];}return t;});
  const addCat=()=>{const n=prompt("New category name:");if(n&&n.trim())update(t=>{t.packing=t.packing||{};if(!t.packing[n.trim()])t.packing[n.trim()]=[];return t;});};
  return (
    <div>
      <div className="section-title"><h2>Packing</h2><span className="chip">{done}/{all.length} packed</span></div>
      {all.length>0 && <div className="prog"><i style={{width:(all.length?done/all.length*100:0)+"%"}}/></div>}
      {cats.map(cat=>(
        <div className="card" key={cat}>
          <h3 style={{fontSize:18,marginBottom:8}}>{packIcon(cat)} {cat}</h3>
          {(packing[cat]||[]).map((item,idx)=>(
            <div className={"checkline "+(checked[item]?"done":"")} key={idx}>
              <div className={"checkbox "+(checked[item]?"on":"")} onClick={()=>toggle(item)}>{checked[item]?"✓":""}</div>
              <span className="ct"><Editable value={item} onChange={v=>editItem(cat,idx,v)}/></span>
              <button className="icon-btn" onClick={()=>delItem(cat,idx)}>✕</button>
            </div>
          ))}
          <AddLine placeholder={`Add to ${cat}`} onAdd={v=>addItem(cat,v)}/>
        </div>
      ))}
      {cats.length===0 && <div className="card muted center">No packing categories yet.</div>}
      <button className="btn ghost sm" onClick={addCat}>+ Add category</button>
    </div>
  );
}
function AddLine({placeholder,onAdd}){
  const [v,setV]=useState(""); const submit=()=>{ if(v.trim()){onAdd(v.trim());setV("");} };
  return <div className="addline"><input value={v} onChange={e=>setV(e.target.value)} placeholder={placeholder} onKeyDown={e=>e.key==="Enter"&&submit()}/><button className="btn sm" onClick={submit}>Add</button></div>;
}

/* ============ QUESTS ============ */
function Quests({trip,update}){
  const quests=trip.quests||[];
  const getText=(q)=>q.text||q.name||""; const getCat=(q)=>q.category||q.cat||"activity";
  const done=quests.filter(q=>q.done).length;
  const toggle=(i)=>update(t=>{t.quests[i].done=!t.quests[i].done;return t;});
  const add=(text)=>update(t=>{(t.quests=t.quests||[]).push({id:uid("q"),text,category:"activity",done:false,city:"any"});return t;});
  const del=(i)=>update(t=>{t.quests.splice(i,1);return t;});
  const cycleCat=(i)=>update(t=>{const q=t.quests[i];const key=q.category!==undefined?"category":(q.cat!==undefined?"cat":"category");const v=q[key]||"activity";q[key]=CAT_ORDER[(CAT_ORDER.indexOf(v)+1)%CAT_ORDER.length];return t;});
  const editText=(i,v)=>update(t=>{const q=t.quests[i];const key=q.text!==undefined?"text":(q.name!==undefined?"name":"text");q[key]=v;return t;});
  const byCity={}; quests.forEach((q,i)=>{ const c=(q.city||"any"); (byCity[c]=byCity[c]||[]).push({q,i}); });
  return (
    <div>
      <div className="section-title"><h2>Quest Log</h2><span className="chip">⚔️ {done}/{quests.length} complete</span></div>
      {quests.length>0 && <div className="prog"><i style={{width:(quests.length?done/quests.length*100:0)+"%"}}/></div>}
      {Object.entries(byCity).map(([city,items])=>(
        <div className="card" key={city}>
          <h3 style={{fontSize:17,marginBottom:6,textTransform:"capitalize"}}>{city==="any"?"Anywhere":city}</h3>
          {items.map(({q,i})=>{ const cat=getCat(q); const meta=CATS[cat]||{c:"var(--muted2)",label:cat};
            return (
            <div className={"quest "+(q.done?"done":"")} key={q.id||i}>
              <div className={"checkbox "+(q.done?"on":"")} onClick={()=>toggle(i)}>{q.done?"✓":""}</div>
              <div style={{flex:1,minWidth:0}}>
                <div className="qt"><Editable value={getText(q)} onChange={v=>editText(i,v)}/></div>
                {q.notes && <div className="qsub">{q.notes}</div>}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span className="qbadge" style={{background:meta.c,cursor:"pointer"}} onClick={()=>cycleCat(i)} title="Change category">{meta.label}</span>
                <button className="icon-btn" onClick={()=>del(i)}>✕</button>
              </div>
            </div>); })}
        </div>
      ))}
      <div className="card"><AddLine placeholder="Add a quest…" onAdd={add}/></div>
    </div>
  );
}

/* ============ INFO ============ */
function Info({trip,update}){
  const info=trip.info;
  const hotelDistances=useMemo(()=>{ const hc=trip.hotelCoords||{},cc=trip.cityCoords||{};
    return Object.entries(hc).map(([city,h])=>({city,name:h.name,km:cc[city]?haversine(h,cc[city]):null})).filter(x=>x.name); },[trip.hotelCoords,trip.cityCoords]);
  const isArr=Array.isArray(info);
  const hasStruct=info&&!isArr&&typeof info==="object"&&Object.keys(info).length>0;
  const addSection=()=>update(t=>{ if(!Array.isArray(t.info)) t.info=[]; t.info.push({title:"New section",content:""}); return t; });
  return (
    <div>
      <div className="section-title"><h2>Info & Tips</h2>{(isArr||!hasStruct)&&<button className="btn sm" onClick={addSection}>+ Add section</button>}</div>

      {hotelDistances.length>0 && <div className="card info-block"><h3>🏨 Where you're staying</h3>
        <ul className="info-list">{hotelDistances.map(h=><li key={h.city}><b>{h.name}</b> <span className="muted" style={{textTransform:"capitalize"}}>({h.city})</span>{h.km!=null && <span className="muted"> · ~{h.km} km from center</span>}</li>)}</ul></div>}

      {isArr && info.map((sec,i)=>(
        <div className="card info-block" key={i}>
          <div style={{display:"flex",justifyContent:"space-between",gap:10}}>
            <h3><Editable value={sec.title} onChange={v=>update(t=>{t.info[i].title=v;return t;})} placeholder="Section title"/></h3>
            <button className="icon-btn" onClick={()=>update(t=>{t.info.splice(i,1);return t;})}>🗑</button>
          </div>
          <div className="info-content"><Editable value={sec.content} onChange={v=>update(t=>{t.info[i].content=v;return t;})} placeholder="Details…" multiline/></div>
        </div>
      ))}

      {hasStruct && <StructInfo info={info}/>}

      {trip.bookings && trip.bookings.length>0 && <div className="card info-block"><h3>📋 Bookings tracker</h3>
        {trip.bookings.map((b,i)=>(<div className="checkline" key={b.id||i}>
          <div className={"checkbox "+(b.status==="booked"?"on":"")} onClick={()=>update(t=>{t.bookings[i].status=t.bookings[i].status==="booked"?"not_booked":"booked";return t;})}>{b.status==="booked"?"✓":""}</div>
          <span className="ct"><b>{b.vendor}</b> <span className="muted small">· {b.cost}</span>{b.notes && <div className="muted small">{b.notes}</div>}</span></div>))}</div>}

      {trip.budget_estimate?.per_person_cad && <div className="card info-block"><h3>🧮 Budget (per person)</h3>
        <ul className="info-list">{Object.entries(trip.budget_estimate.per_person_cad).filter(([k])=>!k.startsWith("total")).map(([k,v])=><li key={k} style={{textTransform:"capitalize"}}>{k.replace(/_/g," ")}: ${v}</li>)}</ul>
        <div style={{marginTop:10,fontWeight:700,fontSize:16}}>Total: ${trip.budget_estimate.per_person_cad.total_low}-${trip.budget_estimate.per_person_cad.total_high} CAD</div></div>}

      {!isArr && !hasStruct && hotelDistances.length===0 && !trip.bookings && !trip.budget_estimate && <div className="card muted center">No info yet. Add a section.</div>}
    </div>
  );
}
function StructInfo({info}){
  const blocks=[];
  if(info.currency) blocks.push(<div className="card info-block" key="cur"><h3>💱 Currency</h3><div className="muted small">{info.currency.name} · {info.currency.rate}</div>{info.currency.notes&&<p className="info-content" style={{marginTop:6}}>{info.currency.notes}</p>}</div>);
  if(info.language) blocks.push(<div className="card info-block" key="lang"><h3>🗣 Language</h3><div className="muted small">{info.language.primary}{info.language.tourist_areas?` · ${info.language.tourist_areas}`:""}</div>{info.language.useful_phrases&&<ul className="info-list" style={{marginTop:6}}>{info.language.useful_phrases.map((p,i)=><li key={i}>{p}</li>)}</ul>}</div>);
  if(info.food_price_ceilings) blocks.push(<div className="card info-block" key="fpc"><h3>🍽 Food price ceilings</h3><ul className="info-list">{Object.entries(info.food_price_ceilings).map(([k,v])=><li key={k} style={{textTransform:"capitalize"}}>{k.replace(/_/g," ")}: <span className="price-tag">{v}</span></li>)}</ul></div>);
  if(info.tipping) blocks.push(<div className="card info-block" key="tip"><h3>💵 Tipping</h3><ul className="info-list">{Object.entries(info.tipping).map(([k,v])=><li key={k} style={{textTransform:"capitalize"}}>{k.replace(/_/g," ")}: {v}</li>)}</ul></div>);
  if(info.scams_to_expect) blocks.push(<div className="card info-block" key="scam"><h3>⚠️ Scams to expect</h3><ul className="info-list">{info.scams_to_expect.map((s,i)=><li key={i}>{s}</li>)}</ul></div>);
  if(info.drinking) blocks.push(<div className="card info-block" key="drink"><h3>🍷 Drinking</h3><p className="info-content">{info.drinking}</p></div>);
  if(info.sim_card) blocks.push(<div className="card info-block" key="sim"><h3>📱 SIM card</h3><p className="info-content">{info.sim_card}</p></div>);
  if(info.weather_expectations) blocks.push(<div className="card info-block" key="we"><h3>🌡 Weather expectations</h3><ul className="info-list">{Object.entries(info.weather_expectations).map(([k,v])=><li key={k} style={{textTransform:"capitalize"}}>{k.replace(/_/g," ")}: {v}</li>)}</ul></div>);
  if(info.moga_festival) blocks.push(<div className="card info-block" key="moga"><h3>🎶 Festival</h3><p className="info-content">{info.moga_festival}</p></div>);
  if(info.seans_notes) blocks.push(<div className="card info-block" key="sean"><h3>📓 Local friend's notes{info.seans_notes.source?` (${info.seans_notes.source})`:""}</h3>
    {info.seans_notes.key_rules&&<><div className="muted small">Key rules</div><ul className="info-list">{info.seans_notes.key_rules.map((r,i)=><li key={i}>{r}</li>)}</ul></>}
    {info.seans_notes.specific_spots&&<><div className="muted small" style={{marginTop:8}}>Specific spots</div><ul className="info-list">{info.seans_notes.specific_spots.map((r,i)=><li key={i}>{r}</li>)}</ul></>}</div>);
  return <>{blocks}</>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
